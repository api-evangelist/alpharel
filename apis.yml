name: Alpharel
description: 'Alpharel, Inc. was a Camarillo, California document-management and imaging
  company founded in 1981 that built turnkey digital document transmission and management
  systems (scanners, optical disks, terminals, LANs) for industrial, commercial, and
  government use. It acquired Optigraphics in 1993, renamed itself Altris Software in
  October 1996, and its business was ultimately succeeded by Spescom Software, Inc. of
  San Diego. Alpharel appears in the Battery Ventures portfolio list. The company is
  DEFUNCT under this name: it has no active first-party website, developer portal, API,
  or SDKs, so there is no API/developer surface for the enrichment pipeline to harvest.'
